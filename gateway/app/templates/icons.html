{% macro icon(name) -%}
<svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false">
{% if name == 'feeding' %}

{% elif name == 'solid_food' %}
  <path d="M3 12h18a9 9 0 0 1-18 0ZM8 21h8M8 8V5M12 8V3M16 8V5"/>
{% elif name == 'sleep' %}
  <path d="M20 14a8.5 8.5 0 0 1-10-10A8.5 8.5 0 1 0 20 14Z"/><path d="m17 3 .6 1.4L19 5l-1.4.6L17 7l-.6-1.4L15 5l1.4-.6Z"/>
{% elif name == 'poopoo' %}

{% elif name == 'supplement' %}
  <path d="m9 5-4 4a6 6 0 0 0 8.5 8.5l4-4A6 6 0 0 0 9 5ZM7 7l10 10"/>
{% elif name == 'heart' %}
  <path d="M20 5a5 5 0 0 0-8 1 5 5 0 0 0-8-1C-1 10 7 17 12 21c5-4 13-11 8-16Z"/>
{% elif name == 'journal' %}
  <rect x="5" y="3" width="15" height="18" rx="3"/><path d="M9 3v18M3 7h4M3 12h4M3 17h4M13 8h3M13 12h3"/>
{% elif name == 'settings' %}
  <path d="M4 7h7M15 7h5M4 17h3M11 17h9"/><circle cx="13" cy="7" r="2"/><circle cx="9" cy="17" r="2"/>
{% elif name == 'calendar' %}
  <rect x="3" y="5" width="18" height="16" rx="3"/><path d="M7 3v4M17 3v4M3 11h18M8 15h2M14 15h2"/>
{% elif name == 'plus' %}
  <path d="M12 5v14M5 12h14"/>
{% else %}
  <path d="m12 3 2.5 6.5L21 12l-6.5 2.5L12 21l-2.5-6.5L3 12l6.5-2.5ZM20 2v4M18 4h4"/>
{% endif %}
</svg>
